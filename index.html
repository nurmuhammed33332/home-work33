<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Угадай число</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; transition: background 0.3s; }
        .message { font-weight: bold; font-size: 1.2rem; margin: 15px; }
        .success { color: green; }
        .error { color: red; }
        
     
        body.dark-theme { background-color: #2c3e50; color: #ecf0f1; }
        body.dark-theme input { background: #34495e; color: #fff; border: 1px solid #7f8c8d; }
    </style>
</head>
<body>

    <button id="theme-toggle">🌓 Сменить тему</button>

    <h1>Игра «Угадай число»</h1>
    <p>Компьютер загадал число от 1 до 10. У вас есть 5 попыток!</p>

    <input type="number" id="user-input" placeholder="Введи число...">
    <button id="check-btn">Проверить</button>
    <button id="reset-btn">Новая игра</button>

   
    <div id="message" class="message"></div>
    <p>Осталось попыток: <span id="attempts-count">5</span></p>
    

    <p>Ваши догадки: <span id="history">-</span></p>

    <script src="./main.js"></script>
</body>
</html>
